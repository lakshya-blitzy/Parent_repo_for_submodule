# Packaging, metadata, and tool configuration for the is-sorted Flask application.
#
# Replaces the original npm package.json (Section 0.4 Transformation Mapping).
# Centralizes project metadata plus pytest and ruff configuration, which replace
# the npm `scripts` (tape test / standard lint).

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "is-sorted"
version = "1.0.5"
description = "A compact module to check if an Array is sorted (Python 3 / Flask port)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Cousens" }]
keywords = ["is-sorted", "sorting", "sort", "sorted", "array", "list", "comparison"]
dependencies = [
    "Flask==3.1.3",
    "gunicorn==26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.urls]
Homepage = "https://github.com/dcousens/is-sorted"
Repository = "https://github.com/dcousens/is-sorted.git"
Issues = "https://github.com/dcousens/is-sorted/issues"

# Discover the application package. Tolerant of the package not yet existing
# during early environment setup (yields a metadata-only build until app/ lands).
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
