[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "is-sorted"
version = "1.0.5"
description = "A compact module to check if an Array is sorted"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Daniel Cousens" }]
keywords = ["is-sorted", "sorting", "sort", "sorted", "array", "list", "comparison"]
dependencies = [
    "Flask==3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.urls]
Homepage = "https://github.com/dcousens/is-sorted"
Repository = "https://github.com/dcousens/is-sorted.git"
"Bug Tracker" = "https://github.com/dcousens/is-sorted/issues"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
